[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sfr-evaluator"
version = "0.1.0"
description = "Rental deal evaluator for individual investors: houses, condos, small multifamily, fixer-uppers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.1",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
sfr-eval = "sfr_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sfr_evaluator = ["data/*", "web/index.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["DTZ011"]   # date.today() only feeds calendar-year arithmetic; time zones don't matter

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
