# Your investor profile: everything about a deal that isn't the property itself.
# Used by `sfr-eval screen` for every listing; also a reference for the defaults.
# Rates are fractions (0.07 == 7%). Delete a line to use the model's default.

loan:
  type: conventional          # conventional | dscr | commercial | fha (5+ units default to commercial)
  credit_score: 740           # prices the rate and PMI from the weekly market rate
  down_payment_pct: 0.25      # 1.0 = all cash
  points_pct: 0.0
  # rate: 0.0725              # a lender quote overrides the priced rate

management:
  mode: pm                    # pm | self
  pm_fee_pct: 0.09            # of rent collected
  leasing_fee_pct: 0.75       # x one month's rent per new lease
  renewal_fee: 200
  maintenance_markup_pct: 0.10
  diy_pct: 0.25               # self-managed: share of repairs you do yourself
  hours_per_unit_month: 2
  hourly_value: 0             # $/hr for your time; 0 = not counted

operations:
  credit_loss_pct: 0.01       # unpaid rent, separate from vacancy
  lease_up_months: 1
  replacement_cost_psf: 160   # rebuild cost; drives the age-based upkeep reserve and insurance

growth:                       # each line grows with its own long-run index
  general_inflation: 0.025    # CPI-U
  rent: 0.03                  # CPI rent of primary residence (~3.3%/yr since 1990)
  maintenance: 0.035          # construction labor + materials
  utilities: 0.035
  # appreciation and property_tax default to the zip-adjusted long-run rate, insurance to 5%,
  # and HOA dues to the HOA's own history fading to its insurance + upkeep mix

tax:
  filing_status: mfj          # mfj | single
  household_income: 150000    # MAGI before the property
  state_rate: 0.05
  real_estate_professional: false
  active_participation: true
  cost_seg_pct: 0.0
  bonus_depreciation_pct: 1.0
  exchange_1031: false

exit:
  hold_years: 10
  selling_cost_pct: 0.07

targets:
  margin_of_safety_pct: 0.10
  estimate_allowance_pct: 0.10    # added to every estimated (not quoted) expense
  min_cash_on_cash: 0.06
  min_monthly_cash_flow_per_unit: 100
  min_dscr: 1.20
  min_irr: 0.10                   # after tax
