# Example underwriting assumptions. Copy to assumptions.yaml and tune per market.
# Rates are fractions (0.05 == 5%). Every field maps 1:1 to schemas.Assumptions.

# --- Operating ---
physical_vacancy: 0.05      # submarket-driven physical vacancy
credit_loss: 0.01           # tenant-quality-driven; kept separate from vacancy
mgmt_fee: 0.08              # % of effective gross income
maintenance_pct: 0.05       # ongoing R&M, % of EGI (separate from capex reserve)
insurance_annual: 1800
other_opex_annual: 600

# --- CapEx reserve (sinking fund) ---
roof_life: 25
roof_cost: 12000
hvac_life: 18
hvac_cost: 7000
water_heater_life: 12
water_heater_cost: 1500

# --- Acquisition / disposition ---
closing_cost_pct: 0.03
rehab_budget: 0
selling_cost_pct: 0.07

# --- Growth ---
rent_growth: 0.03
expense_growth: 0.03
hold_years: 5

# --- Exit (exit cap should carry a spread over entry, never equal it) ---
exit_cap_rate: 0.06
exit_cap_spread_bps: 75

# --- Taxes (post-sale reassessment) ---
reassess_on_sale: true
assessment_ratio: 1.0
millage_rate: 0.012

# --- Debt ---
ltv: 0.75
interest_rate: 0.07
amort_years: 30
stress_rate_bps: 100        # DSCR tested at interest_rate + this

# --- Gates / hurdles ---
min_rent_to_price: 0.008    # 0.8% / month
min_cash_on_cash: 0.06
min_dscr: 1.25
min_yoc_exit_spread_bps: 150
min_levered_irr: 0.15
