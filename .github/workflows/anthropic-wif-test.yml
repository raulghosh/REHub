# Checks Workload Identity Federation end to end: GitHub's OIDC token is exchanged for a
# short-lived Anthropic token, which makes one Claude call. No API key is stored anywhere.
#
# Before running, add these repository variables (Settings > Secrets and variables > Actions >
# Variables) with the IDs from the Claude Console's Workload identity page:
#   ANTHROPIC_FEDERATION_RULE_ID   fdrl_...
#   ANTHROPIC_ORGANIZATION_ID      your organization's ID
#   ANTHROPIC_SERVICE_ACCOUNT_ID   svac_...
#   ANTHROPIC_WORKSPACE_ID         wrkspc_...  (only if the rule covers more than one workspace)
# Run it from the Actions tab ("Run workflow"). The federation rule must match this run's
# subject, e.g. repo:<owner>/<repo>:ref:refs/heads/main when run on main.
name: Anthropic WIF test

on:
  workflow_dispatch:   # manual only: each run makes a (tiny) billed Claude call

permissions:
  id-token: write      # lets the job request GitHub's OIDC token
  contents: read

jobs:
  wif-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_FEDERATION_RULE_ID: "fdrl_015xTETmyGUDUEDGnK4EHGGw"
      ANTHROPIC_ORGANIZATION_ID: "4d8a2e2b-c298-4c2a-9d35-0c6a64913b27"
      ANTHROPIC_SERVICE_ACCOUNT_ID: "svac_01B2sqJRCHSpc9ct2B42zqN8"
      ANTHROPIC_WORKSPACE_ID: "wrkspc_01RSznVYbZS21z4ekGzcUK9K"
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - name: Check the federation settings
        env:
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          missing=""
          for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          # only set the workspace when given: an empty value would be sent as a workspace ID
          if [ -n "$WORKSPACE_ID" ]; then echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE_ID" >> "$GITHUB_ENV"; fi
          echo "Run subject: repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF} (the federation rule must match it)"

      - name: Fetch GitHub OIDC token
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          if [ ! -s "$ANTHROPIC_IDENTITY_TOKEN_FILE" ] || [ "$(cat "$ANTHROPIC_IDENTITY_TOKEN_FILE")" = "null" ]; then
            echo "::error::GitHub returned no OIDC token. Is 'id-token: write' allowed for this repository?"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Anthropic SDK
        run: pip install "anthropic>=2.1"

      - name: Exchange the token and call Claude
        shell: python
        run: |
          import anthropic

          # No API key in the environment: the SDK reads the ANTHROPIC_* federation variables,
          # exchanges the GitHub token at /v1/oauth/token, and uses the short-lived token it gets back.
          client = anthropic.Anthropic()
          try:
              message = client.messages.create(
                  model="claude-opus-5-5",
                  max_tokens=1024,
                  output_config={"effort": "low"},
                  messages=[{"role": "user", "content": "Reply with exactly: WIF OK"}],
              )
          except anthropic.WorkloadIdentityError as e:   # the exchange itself failed
              print(f"::error::Token exchange failed: {e}")
              print("A 401 'Authentication failed' is deliberately vague: the reason is in the Claude Console, "
                    "Workload identity page > authentication history (most often the rule's subject_prefix "
                    "not matching the run subject printed in the first step).")
              raise
          except anthropic.AuthenticationError:
              print("::error::The token exchange worked but the API rejected the token: check the rule's "
                    "workspace and the service account's workspace membership.")
              raise
          reply = next((b.text for b in message.content if b.type == "text"), "").strip()
          print(f"Claude replied: {reply!r} (model {message.model}, stop reason {message.stop_reason})")
          print("Workload Identity Federation works.")
